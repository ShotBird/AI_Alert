<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>AI Alert — 오늘의 AI 동향</title>
<meta name="description" content="매일 아침 생성되는 AI 동향 보드 — 모델 업데이트, GitHub 스킬, 뉴스, 키워드를 한 화면에서 봅니다.">

     매니페스트 지원은 애플이 문서화하지 않은 미검증 동작이라, 동일 출처 파일이 안전하다. -->

<meta name="mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">

<style>
  /* ── 토큰: DESIGN.md (Apple España) 그대로. 새 색을 만들지 않는다. ───────── */
  :root {
    --canvas:      #f5f5f7;  /* Pure Canvas */
    --surface:     #ffffff;  /* Paper White */
    --ink:         #1d1d1f;  /* Obsidian    */
    --ink-soft:    #474747;  /* Slate       */
    --ink-mute:    #707070;  /* Iron Gray   */
    --hairline:    #d6d6d6;  /* Fog         */
    --mist:        #e2e2e5;  /* Mist        */
    --action:      #0071e3;  /* Signal Blue */
    --link:        #0066cc;  /* Deep Link Blue */
    --tint-green:  #03aa49;  /* Pulse Green */
    --tint-violet: #8668ff;  /* Ultraviolet */
    --tint-orange: #ed6300;  /* Ember Orange */
    --tint-teal:   #00a1b3;  /* Lagoon Teal */

    --r-card: 28px;
    --r-pill: 980px;
    --r-chip: 10px;

    /* 웹폰트 CDN 없이 시스템 폰트만 쓴다 — 애플 기기에서는 이게 SF Pro 그 자체다. */
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
    --font-text:    -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Helvetica Neue", system-ui, sans-serif;
  }

  /* 다크: 새 색을 도입하지 않고 시스템 안의 역할만 뒤집는다.
     Void(#000000)가 바탕, Obsidian(#1d1d1f)이 카드, Pure Canvas(#f5f5f7)가 글자. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --canvas:   #000000;
      --surface:  #1d1d1f;
      --ink:      #f5f5f7;
      --ink-soft: #d6d6d6;
      --ink-mute: #707070;
      --hairline: #333336;
      --mist:     #333336;
    }
  }
  :root[data-theme="dark"] {
    --canvas:   #000000;
    --surface:  #1d1d1f;
    --ink:      #f5f5f7;
    --ink-soft: #d6d6d6;
    --ink-mute: #707070;
    --hairline: #333336;
    --mist:     #333336;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    font-family: var(--font-text);
    font-size: 17px;          /* 본문은 17px 하나뿐 */
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding-inline: 20px;
    padding-block: 0 64px;
  }

  /* ── 헤더 ──────────────────────────────────────────────────────────────── */
  header.board {
    padding-block: 36px 8px;
  }
  .date-line {
    font-size: 14px;
    color: var(--ink-mute);
    letter-spacing: 0.01em;
    margin: 0 0 6px;
    min-height: 1.4em;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 39px;
    line-height: 1.07;
    letter-spacing: -0.005em;
    margin: 0 0 14px;
    text-wrap: balance;
  }
  h1 .tint { color: var(--tint-green); }

  .status-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 4px;
    min-height: 30px;
  }
  .chip {
    font-size: 14px;
    padding: 5px 12px;
    border-radius: var(--r-pill);
    background: var(--mist);
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .chip.warn   { color: var(--tint-orange); }
  .chip.stale  { color: var(--tint-orange); }

  /* ── 오늘의 키워드 스트립: 헤더 바로 아래, 구획 바로가기보다 위. 일반 카드 섹션과
     의도적으로 다른, 작고 가로 스크롤되는 한 줄짜리 특수 레이아웃. ───────────────── */
  /* ── 오늘의 키워드 띠 ──────────────────────────────────────────────────────
     아래 섹션 바로가기와 **모양을 반드시 다르게** 둔다. 둘 다 둥근 알약이었을 때
     사용자가 구분하지 못했다. 규칙: 둥근 알약 = 이동, 각진 테두리 칩 = 데이터. */
  .kw-strip {
    background: var(--surface);
    border-radius: var(--r-card);
    padding: 14px 18px 16px;
    margin-top: 6px;
  }
  .kw-strip:empty { display: none; padding: 0; }
  .kw-strip-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-mute);
    letter-spacing: 0.02em;
    margin: 0 0 10px;
  }
  .kw-row {
    display: flex;
    flex-wrap: wrap;          /* 가로 스크롤 대신 줄바꿈. 스크롤은 있는 줄도 모른다 */
    gap: 8px;
    padding: 0;
  }
  .kw-pill {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.2;
    padding: 7px 11px;
    border: 1px solid var(--hairline);
    border-radius: var(--r-chip);   /* 10px — 알약(980px)과 한눈에 갈린다 */
    background: transparent;
    color: var(--ink);
    cursor: pointer;
  }
  .kw-pill:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
  .kw-pill[aria-expanded="true"] {
    border-color: var(--ink);
    background: var(--mist);
  }
  .kw-word.new { color: var(--tint-green); }
  .kw-n {
    font-weight: 400;
    font-size: 12px;
    color: var(--ink-mute);
    font-variant-numeric: tabular-nums;
  }
  .kw-empty { font-size: 14px; color: var(--ink-mute); margin: 0; }

  /* 펼침: 그 키워드가 실제로 어느 기사에서 나왔는지 보여준다 */
  #kwDetail:not(:empty) { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--hairline); }
  .kwd-head { font-size: 13px; color: var(--ink-mute); margin: 0 0 8px; }
  .kwd-head b { color: var(--ink); font-weight: 600; }
  .kwd-list { display: grid; gap: 9px; }
  .kwd-item { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: baseline; }
  .kwd-src { font-size: 12px; color: var(--ink-mute); white-space: nowrap; }
  .kwd-item a {
    font-size: 14px; line-height: 1.35; color: var(--ink); text-decoration: none;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* ── 섹션 바로가기 (풀 필 버튼 언어) ──────────────────────────────────── */
  nav.jump {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-block: 18px 6px;
    scrollbar-width: none;
  }
  nav.jump:empty { padding: 0; }
  nav.jump::-webkit-scrollbar { display: none; }
  nav.jump a {
    flex: 0 0 auto;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: var(--r-pill);
    background: var(--mist);
    color: var(--ink);
    text-decoration: none;
  }

  /* ── 섹션 ──────────────────────────────────────────────────────────────── */
  section { padding-block: 34px 0; scroll-margin-top: 16px; }

  h2 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 28px;
    line-height: 1.14;
    letter-spacing: 0.007em;
    margin: 0 0 14px;
  }

  /* 섹션 주석 — 목록이 짧은 이유. 본문보다 작고 조용하게, 그러나 보이게. */
  .s-notes {
    margin: 10px 0 0; padding: 0; list-style: none;
    display: grid; gap: 5px;
  }
  .s-notes li {
    font-size: 13px; line-height: 1.45; color: var(--ink-mute);
    padding-left: 13px; position: relative;
  }
  .s-notes li::before {
    content: ""; position: absolute; left: 0; top: 8px;
    width: 5px; height: 1px; background: var(--hairline);
  }

  .briefing {
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
    padding-block: 14px;
    margin-bottom: 20px;
  }
  .briefing ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; }
  .briefing li { color: var(--ink-soft); font-size: 17px; }
  .briefing li::before {
    content: "—";
    color: var(--ink-mute);
    margin-right: 8px;
  }

  .cards { display: grid; gap: 12px; }

  article.card {
    background: var(--surface);
    border-radius: var(--r-card);
    padding: 22px 24px;
    /* 그림자 없음. 깊이는 표면 대비로만. */
  }

  .card-top {
    display: flex;
    gap: 8px;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .badge {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge.new  { color: var(--tint-green); }
  .badge.cont { color: var(--ink-mute); }

  .title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 21px;
    line-height: 1.33;
    letter-spacing: 0.011em;
    margin: 0;
    text-wrap: balance;
  }
  .title a { color: var(--ink); text-decoration: none; }
  .title a:hover { color: var(--link); }

  .summary {
    margin: 8px 0 0;
    color: var(--ink-soft);
  }

  .meta {
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--hairline);
    font-size: 14px;
    color: var(--ink-mute);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 14px;
    font-variant-numeric: tabular-nums;
  }
  .meta:empty { display: none; }
  .meta .strong { color: var(--ink-soft); }

  /* ── 키워드 카드 ───────────────────────────────────────────────────────── */
  .kw-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .kw-term {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 24px;
    letter-spacing: 0.009em;
    margin: 0;
  }
  .kw-ko { color: var(--ink-mute); font-size: 17px; }

  .reaction {
    margin-top: 14px;
    display: grid;
    gap: 8px;
  }
  .rbar { display: grid; grid-template-columns: 90px 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
  .rbar .lab { color: var(--ink-mute); }
  .rbar .track { height: 3px; background: var(--mist); border-radius: var(--r-pill); overflow: hidden; }
  .rbar .fill  { height: 100%; background: var(--ink-soft); }
  .rbar .num   { color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  .picks { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hairline); display: grid; gap: 8px; }
  .picks a { color: var(--link); text-decoration: none; font-size: 14px; border-bottom: 1px solid var(--link); }
  .picks .src { color: var(--ink-mute); font-size: 14px; }

  /* ── 빈 섹션 ───────────────────────────────────────────────────────────── */
  .empty {
    background: var(--surface);
    border-radius: var(--r-card);
    padding: 22px 24px;
    color: var(--ink-mute);
    font-size: 17px;
  }

  /* ── 벤더 현황판 ────────────────────────────────────────────────────────────
     DESIGN.md 에서 의도적으로 벗어난 유일한 곳. 회사 11곳을 28px 카드로 쌓으면
     화면의 절반을 먹는데, 여기서 알고 싶은 건 "누가 언제 무엇을 냈나" 한 줄이다.
     카드 대신 행, 17px 대신 15px, 행 높이는 한 줄 높이까지 줄였다.
     (예외는 CLAUDE.md 에 기록해 두었다 — 규칙 위반으로 보고 되돌리지 말 것.) */
  .v-table {
    background: var(--surface);
    border-radius: var(--r-card);
    padding: 6px 18px 10px;
    overflow: hidden;
  }
  .v-row {
    display: grid;
    grid-template-columns: minmax(84px, 1fr) minmax(0, 2fr) auto;
    gap: 12px;
    align-items: baseline;
    padding-block: 9px;
    border-bottom: 1px solid var(--hairline);
    font-size: 15px;
    line-height: 1.3;
  }
  .v-row:last-child { border-bottom: 0; }

  /* 벤치마크 줄이 있는 행만 감싼다 — 감싸는 이유는 한 행 밑에 두 번째 줄을 붙이면서도
     하이라인 경계는 여전히 "회사 한 곳당 하나"로 유지하기 위해서다. 벤치마크가 없으면
     .v-row 자체가 곧 그 회사의 전부이고 자리도 늘지 않는다. */
  .v-item { border-bottom: 1px solid var(--hairline); }
  .v-item:last-child { border-bottom: 0; }
  .v-item .v-row { border-bottom: 0; }
  .v-item.has-bench .v-row { padding-bottom: 2px; }
  .v-bench {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 10px;
    padding: 0 0 9px;
    font-size: 12px;
    color: var(--ink-mute);
    font-variant-numeric: tabular-nums;
  }
  .v-bench-fig b { font-weight: 600; color: var(--ink-soft); margin-right: 3px; }
  .v-bench-src::before { content: "· 출처 "; }
  .v-head {
    font-size: 13px;
    color: var(--ink-mute);
    padding-block: 8px 7px;
    letter-spacing: 0.01em;
  }
  .v-co {
    font-weight: 600;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* 모델 업데이트의 회사 칸만 두 줄을 허용한다 ("Alibaba Qwen" 이 잘렸다).
     GitHub·커뮤니티 표의 .v-co 는 한 줄 말줄임 그대로 둔다. */
  .m-row .v-co {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    white-space: normal;
    overflow-wrap: anywhere;
    line-height: 1.25;
  }
  /* 이름과 ↗ 를 한 상자에 넣고 말줄임을 걸었더니, 모델명이 길면 **말줄임이
     아이콘까지 먹어서** 링크가 화면에 없고 눌리지도 않았다. 잘려야 하는 것은
     이름뿐이다. 그래서 둘을 나란한 칸으로 만들고 말줄임은 이름에만 건다. */
  .v-model {
    color: var(--ink-soft);
    display: flex;
    align-items: flex-start;   /* 두 줄이 되어도 ↗ 는 첫 줄에 남는다 */
    gap: 3px;
    min-width: 0;            /* 이게 없으면 grid 칸이 내용만큼 벌어져 표가 밀린다 */
  }
  /* 한 줄 말줄임으로는 폰에서 `Qwen-Image-2.1-PE-I2I`(155px)가 87px 칸에
     들어가지 않아 대부분 잘렸다. 모델명은 이 표에서 가장 중요한 글자이므로
     자르는 대신 **두 줄까지 흐르게** 둔다. 이름이 짧은 행의 높이는 그대로다. */
  .v-model .v-name {
    color: var(--ink-soft);
    display: -webkit-box;
    -webkit-line-clamp: 3;   /* Qwen-Image-2.1-PE-I2I 는 두 줄로도 안 들어간다 */
    -webkit-box-orient: vertical;
    overflow: hidden;
    overflow-wrap: anywhere;
    line-height: 1.25;
    min-width: 0;
  }
  .v-src {
    flex: 0 0 auto;          /* 이름이 아무리 길어도 아이콘 자리는 먼저 확보된다 */
    color: var(--link);
    text-decoration: none;
    font-size: 13px;
    /* 손가락이 닿을 넓이를 주되, 음수 여백으로 행 높이는 그대로 둔다 */
    padding: 9px 6px;
    margin: -9px -2px;
  }
  .v-src:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
  .v-when {
    display: flex;
    gap: 7px;
    align-items: baseline;
    justify-content: flex-end;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .v-when b { font-weight: 400; color: var(--ink-soft); }
  .v-when i { font-style: normal; font-size: 13px; color: var(--ink-mute); min-width: 38px; text-align: right; }
  .v-when i.v-fresh { color: var(--tint-green); }   /* 오늘·어제 나온 것 */
  .v-when i.v-stale { color: var(--tint-orange); }  /* 석 달 넘게 조용한 곳 */
  .v-none { color: var(--ink-mute); }

  /* GitHub 스킬 부문 칩: kw-pill과 같은 각진 칩 언어, 더 작게 */
  /* 종류(gh-axis 1개) 위, 부문(gh-axis 2개) 아래 — 두 축을 같은 칩 언어로 쌓되
     라벨로만 구분한다. kw-strip-label과 같은 작은 라벨 언어. */
  .gh-axis { margin-bottom: 12px; }
  .gh-axis-label { font-size: 12px; font-weight: 600; color: var(--ink-mute); letter-spacing: 0.02em; margin: 0 0 8px; }
  .gh-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .gh-chip {
    flex: 0 0 auto;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.2;
    padding: 6px 10px;
    border: 1px solid var(--hairline);
    border-radius: var(--r-chip);
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .gh-chip:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
  .gh-chip[aria-pressed="true"] {
    border-color: var(--ink);
    background: var(--mist);
    color: var(--ink);
  }
  .gh-chip-n {
    font-weight: 400;
    font-size: 11px;
    color: var(--ink-mute);
    font-variant-numeric: tabular-nums;
  }
  .gh-chip[aria-pressed="true"] .gh-chip-n { color: var(--ink-soft); }

  .gh-more {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 10px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    border: 1px solid var(--hairline);
    border-radius: var(--r-chip);
    background: transparent;
    color: var(--link);
    cursor: pointer;
  }
  .gh-more:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }

  /* 뉴스 · 커뮤니티: 국내/해외 그룹 라벨. kw-strip-label과 같은 언어 */
  .n-group { margin-bottom: 16px; }
  .n-group:last-child { margin-bottom: 0; }
  .n-group-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-mute);
    letter-spacing: 0.02em;
    margin: 0 0 8px;
  }

  /* GitHub 스킬 · 커뮤니티: 같은 표 언어, 열 비율만 다르다 */
  .g-row { grid-template-columns: minmax(0, 1.45fr) minmax(64px, 0.9fr) auto; }
  .c-row { grid-template-columns: minmax(80px, 1fr) minmax(0, 1.2fr) auto; }
  .g-repo { overflow: hidden; }
  .g-repo a { color: var(--ink); text-decoration: none; font-weight: 600;
              display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .g-repo i { font-style: normal; font-size: 12px; color: var(--ink-mute);
              display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .g-item { border-bottom: 1px solid var(--hairline); }
  .g-item:last-child { border-bottom: 0; }
  .g-item .v-row { border-bottom: 0; padding-block: 9px 2px; }
  .g-desc {
    display: flex; gap: 7px; align-items: baseline;
    padding-bottom: 9px;
    font-size: 13px; line-height: 1.35; color: var(--ink-mute);
  }
  .g-desc > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .g-when { color: var(--ink-soft); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .g-cat { font-size: 13px; color: var(--ink-mute);
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .v-when b.g-up { color: var(--tint-green); font-weight: 600; }
  .c-dom { font-size: 13px; color: var(--ink-mute);
           overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .v-co a { color: var(--ink); text-decoration: none; }

  /* 뉴스: 제목이 곧 내용이라 자르지 않는다. 카드 배경과 여백만 걷어낸다. */
  .n-list {
    background: var(--surface);
    border-radius: var(--r-card);
    padding: 4px 18px 8px;
  }
  .n-row { padding-block: 11px; border-bottom: 1px solid var(--hairline); }
  .n-row:last-child { border-bottom: 0; }
  .n-title {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
    color: var(--ink);
    text-decoration: none;
    font-size: 15px;
    line-height: 1.38;
    font-weight: 600;
  }
  .n-orig-btn {
    flex: 0 0 auto;
    display: inline-flex;
    margin-left: 6px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.2;
    padding: 2px 8px;
    border: 1px solid var(--hairline);
    border-radius: var(--r-chip);
    background: transparent;
    color: var(--ink-mute);
    cursor: pointer;
    vertical-align: middle;
  }
  .n-orig-btn:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
  .n-orig-btn[aria-expanded="true"] { border-color: var(--ink); color: var(--ink-soft); background: var(--mist); }
  .n-orig { margin: 4px 0 0; font-size: 13px; line-height: 1.4; color: var(--ink-mute); }
  .n-sum { margin: 4px 0 0; font-size: 14px; line-height: 1.4; color: var(--ink-soft); }
  .n-meta {
    margin-top: 5px;
    font-size: 12px;
    color: var(--ink-mute);
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px;
    font-variant-numeric: tabular-nums;
  }

  /* ── 모델 업데이트 표: 회사 · 최신 모델 · 갱신 · 다음 예정 4열.
     .v-row 기본 3열을 g-row/c-row 가 같이 쓰므로 여기만 모디파이어로 넓힌다. */
  /* 열 4개인데 눈에는 6덩어리로 보였다 — 헤더는 왼쪽에 붙고 값은 오른쪽에 붙어
     있었고, 열 사이에 경계가 없어 "갱신" 아래 09/20 과 "오늘" 이 서로 다른 열처럼
     읽혔다. 경계선을 실제로 긋고, 헤더를 그 열의 값과 같은 쪽에 붙인다. */
  /* **열 폭은 고정이어야 한다.** 행마다 grid 가 따로 계산되므로 `auto` 를 쓰면
     헤더의 "갱신" 폭과 데이터의 "09/20 오늘" 폭이 서로 달라지고, 결과적으로
     헤더와 셀이 눈으로 안 맞는다 — 실제로 최신 모델 열이 헤더 126~229,
     첫 행 126~151 이었다. fr 과 고정 px 만 쓰면 모든 행이 같은 자리에 선다. */
  .m-row {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) 92px;
    gap: 0;
    align-items: start;      /* 두 줄짜리 칸이 생기면 baseline 은 어긋난다 */
  }
  .m-row > * { padding-inline: 7px; }
  .m-row > *:first-child { padding-left: 0; }
  .m-row > *:last-child { padding-right: 0; }
  .m-row > * + * { border-left: 1px solid var(--hairline); }
  /* 헤더는 그 열의 값과 같은 변에 붙인다. 날짜·예정은 오른쪽 정렬이다. */
  .m-row.v-head > *:nth-child(3) { text-align: right; }
  .m-row.v-head { border-bottom: 1px solid var(--hairline); }
  .m-row .v-when i { min-width: 0; }   /* 상대 시간 칸의 고정폭이 회사 이름을 밀어냈다 */
  .m-row .v-when { font-size: 13px; gap: 5px; }
  /* 다음 예정 아랫줄 — 회사 이름과 왼쪽을 맞춰 "이 회사의 것"임을 보인다 */
  .v-next {
    display: flex; align-items: baseline; gap: 5px;
    justify-content: flex-start;   /* 옛 규칙의 flex-end 를 덮는다 — 아랫줄은 왼쪽에 붙어야 회사와 이어진다 */
    font-size: 13px; padding: 0 0 9px; margin-top: -3px;
    font-variant-numeric: tabular-nums;
  }
  .v-next-lab { font-size: 11px; color: var(--ink-mute); }
  .v-item.has-next .v-row { padding-bottom: 4px; }
  .m-row .v-when b, .m-row .v-next b { font-size: 13px; }
  /* 표의 오른쪽 칸이던 시절의 규칙이다. 이제는 행 아래 한 줄이라
     오른쪽 정렬이면 회사 이름과 끊겨 보인다. */
  .v-next {
    display: flex; gap: 6px; align-items: baseline; justify-content: flex-start;
    white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .v-next b { font-weight: 400; color: var(--ink-soft); }
  .v-next i { font-style: normal; font-size: 13px; }
  .v-next i.fix { color: var(--tint-green); }   /* 확정 — 회사가 날짜를 말한 것 */
  .v-next i.exp { color: var(--tint-orange); }  /* 예정 — 관측·소문 */

  /* ── 1년 마일스톤 ──────────────────────────────────────────────────────────
     가로 스크롤 축이었다. 40개를 담으려고 레일을 4,720px 까지 늘렸는데,
     폰 화면에 한 번에 보이는 건 그 7% 뿐이었다. 사용자 말대로 "사람이 볼 수준"이
     아니었다 — 1년을 보여주겠다면서 1년을 못 보게 만든 설계다.

     그래서 둘로 갈랐다. **띠**는 스크롤 없이 한 화면에 1년을 다 담아 리듬만
     보여주고(점이 겹쳐도 상관없다 — 밀도가 곧 정보다), **목록**은 세로로
     읽는다. 폰에서 자연스러운 방향은 세로 하나뿐이다. */
  .ms-wrap {
    background: var(--surface);
    border-radius: var(--r-card);
    padding: 14px 18px 8px;
    margin-bottom: 10px;
  }
  .ms-label {
    font-size: 12px; font-weight: 600; color: var(--ink-mute);
    letter-spacing: 0.02em; margin: 0 0 12px;
  }

  /* 띠: 1/1 왼쪽 끝, 12/31 오른쪽 끝. 가로 스크롤 없음. */
  .ms-bar { position: relative; height: 34px; margin-bottom: 14px; }
  .ms-axis { position: absolute; left: 0; right: 0; top: 11px; height: 1px; background: var(--hairline); }
  .ms-tick { position: absolute; top: 8px; width: 1px; height: 7px; background: var(--hairline); }
  .ms-mon {
    position: absolute; top: 19px; font-size: 10px; color: var(--ink-mute);
    transform: translateX(-50%); font-variant-numeric: tabular-nums;
  }
  .ms-dot {
    position: absolute; top: 8px; width: 7px; height: 7px; border-radius: 50%;
    background: var(--action); transform: translateX(-50%);
  }
  .ms-today { position: absolute; top: 2px; height: 19px; width: 2px; background: var(--tint-green); transform: translateX(-50%); }
  .ms-today span {
    position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
    font-size: 10px; font-weight: 600; color: var(--tint-green); white-space: nowrap;
  }

  /* 목록: 달마다 한 줄. 빈 달은 아예 나오지 않는다. */
  .ms-months { display: grid; gap: 2px; }
  .ms-mrow {
    display: grid; grid-template-columns: 34px 1fr; gap: 10px;
    align-items: baseline; padding-block: 7px;
    border-top: 1px solid var(--hairline);
  }
  .ms-mrow:first-child { border-top: 0; }
  .ms-mname { font-size: 12px; color: var(--ink-mute); font-variant-numeric: tabular-nums; }
  .ms-items { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .ms-i {
    font-size: 13px; line-height: 1.35; color: var(--ink); text-decoration: none;
    display: inline-flex; gap: 5px; align-items: baseline;
  }
  .ms-i b {
    font-weight: 400; font-size: 11px; color: var(--ink-mute);
    font-variant-numeric: tabular-nums;
  }
  .ms-i.soon { color: var(--tint-orange); }      /* 아직 안 온 날 — 예정 */
  .ms-dot.soon { background: var(--tint-orange); }
  .ms-tag {
    font-style: normal; font-size: 10px; font-weight: 600;
    color: var(--tint-orange); margin-left: 4px;
  }
  .ms-tag.fix { color: var(--tint-green); }
  .ms-empty { font-size: 14px; color: var(--ink-mute); margin: 0 0 6px; }
  .ms-months:not(.open) .ms-hid { display: none; }
  .gh-more { margin-top: 10px; }
  .ms-note { font-weight: 400; color: var(--ink-mute); letter-spacing: 0; }
  .ms-note::before { content: " · "; }

  .n-meta b { font-weight: 600; color: var(--ink-soft); }
  .n-meta i.n-new { font-style: normal; font-weight: 600; color: var(--tint-green); }
  .n-dot { color: var(--hairline); }

  @media (max-width: 360px) {
    .v-row { grid-template-columns: minmax(70px, 1fr) minmax(0, 1.6fr) auto; gap: 8px; }
    .m-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr) 84px; }
    .m-row > * { padding-inline: 7px; }
    .v-model { font-size: 14px; }
    .g-row { grid-template-columns: minmax(0, 1.3fr) minmax(52px, 0.8fr) auto; }
    .c-row { grid-template-columns: minmax(70px, 1fr) minmax(0, 1fr) auto; }
  }

  /* ── 하단 ──────────────────────────────────────────────────────────────── */
  .foot { padding-block: 40px 0; border-top: 1px solid var(--hairline); margin-top: 40px; }
  .foot p { color: var(--ink-mute); font-size: 14px; margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<body>

<div class="wrap">
  <header class="board">
    <p class="date-line" id="dateLine">불러오는 중…</p>
    <h1>오늘의 <span class="tint">AI</span> 동향</h1>
    <div class="status-row" id="statusRow"></div>
  </header>

  <div class="kw-strip" id="kwStrip"></div>

  <nav class="jump" id="jumpNav"></nav>

  <main id="board">
    <div class="empty">보드를 불러오는 중입니다…</div>
  </main>

  <div class="foot">
    <p>이 페이지를 홈 화면에 추가하면 앱처럼 열립니다. 새 보드는 매일 아침 자동으로 갱신됩니다.</p>
  </div>
</div>

<script>
  // ── 실제 보드 계약: docs/roadmap/ai-alert-daily-board/issues/05-daily-board-schema.md ──
  const FETCH_URL = "./latest.json";
  const CACHE_KEY = "ai_alert_board_cache_v1";

  const el = {
    dateLine: document.getElementById("dateLine"),
    statusRow: document.getElementById("statusRow"),
    jumpNav: document.getElementById("jumpNav"),
    board: document.getElementById("board"),
    kwStrip: document.getElementById("kwStrip"),
  };

  // 키워드 스트립 상태: 어떤 필이 펼쳐져 있는지만 기억한다.
  const kwState = { cards: [], openIndex: -1 };

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  const N = n => (typeof n === "number" ? n.toLocaleString("ko-KR") : n);

  // 기기 시간대와 무관하게 "오늘"은 항상 한국 기준으로 판정한다 — 보드가 KST 03:00에 만들어지기 때문.
  function todayKST() {
    return new Intl.DateTimeFormat("en-CA", {
      timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit",
    }).format(new Date());
  }

  function formatGeneratedAt(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    const parts = new Intl.DateTimeFormat("ko-KR", {
      timeZone: "Asia/Seoul", year: "numeric", month: "numeric", day: "numeric",
      weekday: "long", hour: "numeric", minute: "2-digit", hour12: true,
    }).formatToParts(d);
    const get = t => (parts.find(p => p.type === t) || {}).value || "";
    return `${get("year")}년 ${get("month")}월 ${get("day")}일 ${get("weekday")} · `
         + `${get("dayPeriod")} ${get("hour")}시 ${get("minute")}분 생성`;
  }

  function formatBoardDateShort(dateStr) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateStr || ""));
    if (!m) return String(dateStr || "");
    return `${Number(m[2])}월 ${Number(m[3])}일`;
  }

  // ── 데이터 로딩. 실패하면 이전에 성공했을 때 저장해 둔 사본으로 물러난다 ──
  async function loadBoard() {
    let board = null;
    let fetchFailed = false;
    try {
      const res = await fetch(FETCH_URL, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (!data || !Array.isArray(data.sections)) throw new Error("형식이 올바르지 않습니다");
      board = data;
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(board)); } catch (_) { /* 저장 실패는 무시 */ }
    } catch (err) {
      fetchFailed = true;
      try {
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) board = JSON.parse(cached);
      } catch (_) { /* 캐시도 없으면 board 는 null 로 남는다 */ }
    }
    return { board, fetchFailed };
  }

  // ── 카드 렌더링: 필드로 종류를 가른다. 새 섹션이 추가돼도 이 규칙만으로 처리된다 ──
  function badge(change) {
    const isNew = change === "new";
    return `<span class="badge ${isNew ? "new" : "cont"}">${isNew ? "신규" : "지속"}</span>`;
  }

  function isGithubCard(c) {
    return c && (c.repo !== undefined || c.stars_delta !== undefined || c.category !== undefined);
  }
  function isKeywordCard(c) {
    return c && (c.keyword !== undefined || c.korea !== undefined);
  }

  function plainMeta(c) {
    const bits = [];
    if (typeof c.source_count === "number") bits.push(`<span class="strong">출처 ${c.source_count}곳</span>`);
    if (Array.isArray(c.sources) && c.sources.length) {
      const names = c.sources.map(s => s && s.name).filter(Boolean);
      if (names.length) bits.push(`<span>${esc(names.join(" · "))}</span>`);
    }
    if (typeof c.heat === "number") bits.push(`<span>화제도 ${c.heat.toFixed(1)}</span>`);
    return bits.join("");
  }

  // 시각을 "3시간 전"으로. 뉴스 행에 날짜 전체를 적으면 자리만 먹는다.
  function ago(iso) {
    if (!iso) return "";
    const t = Date.parse(iso);
    if (Number.isNaN(t)) return "";
    const h = Math.floor((Date.now() - t) / 3600000);
    if (h < 1) return "방금";
    if (h < 24) return h + "시간";
    const d = Math.floor(h / 24);
    return d < 30 ? d + "일" : Math.floor(d / 30) + "개월";
  }

  // ── 국내/해외 분리: 뉴스·커뮤니티 공통. region이 "global"이면 해외, 그 외(=kr,
  // 누락 포함)는 전부 국내로 묶는다 — 카드가 조용히 사라지는 일이 없게 한다.
  function regionSplitHTML(cards, renderGroup) {
    const global = cards.filter(c => c.region === "global");
    const kr = cards.filter(c => c.region !== "global");
    const parts = [];
    if (global.length) parts.push(`<div class="n-group"><p class="n-group-label">해외</p>${renderGroup(global)}</div>`);
    if (kr.length) parts.push(`<div class="n-group"><p class="n-group-label">국내</p>${renderGroup(kr)}</div>`);
    return parts.join("");
  }

  // ── 뉴스: 카드 대신 행 ────────────────────────────────────────────────────
  // 제목이 곧 내용이라 잘라내면 손해다. 제목은 두 줄까지 살리고, 카드 배경과
  // 안쪽 여백을 걷어내 그 아래 메타를 한 줄로 붙인다.
  // 해외(global) 기사만 한국어 분석(note_ko, 없으면 summary_ko)을 제목 아래 덧붙인다 —
  // 국내 기사는 이미 한국어라 번역 줄이 필요 없다.
  // 해외 기사에 title_ko가 있으면 그걸 헤드라인으로 쓰고, 원문 제목은 "원문" 버튼
  // 뒤에 숨긴다 — title_ko가 없으면 오늘처럼 원문 그대로, 버튼도 없다.
  let newsRowSeq = 0;
  function newsRowHTML(c) {
    const href = c.url ? esc(c.url) : "#";
    const isGlobal = c.region === "global";
    const hasTitleKo = isGlobal && !!c.title_ko;
    const headline = hasTitleKo ? c.title_ko : (c.title || "");
    const origId = "n-orig-" + esc(c.id || String(++newsRowSeq));
    const origToggle = hasTitleKo
      ? `<button type="button" class="n-orig-btn" aria-expanded="false" aria-controls="${origId}" data-orig-toggle="${origId}">원문</button>`
      : "";
    const origBlock = hasTitleKo
      ? `<p class="n-orig" id="${origId}" hidden>${esc(c.title || "")}</p>`
      : "";
    const note = isGlobal ? (c.note_ko || c.summary_ko || "") : "";
    const summary = note ? `<p class="n-sum">${esc(note)}</p>` : "";
    const names = (Array.isArray(c.sources) ? c.sources : [])
      .map(s => s && s.name).filter(Boolean);
    const bits = [];
    if (c.change === "new") bits.push(`<i class="n-new">신규</i>`);
    if (names.length) bits.push(esc(names.slice(0, 2).join(" · ")));
    if (typeof c.source_count === "number" && c.source_count > 1) {
      bits.push(`<b>출처 ${c.source_count}곳</b>`);
    }
    const when = ago(c.published_at);
    if (when) bits.push(when);
    return `<div class="n-row">
      <a class="n-title" href="${href}" target="_blank" rel="noopener noreferrer">${esc(headline)}</a>${origToggle}
      ${origBlock}
      ${summary}
      <div class="n-meta">${bits.join('<span class="n-dot">·</span>')}</div>
    </div>`;
  }

  // ── GitHub 스킬: 레포 | 부문 | 증가 + 설명 한 줄 ─────────────────────────
  function ghKind(c) { return (c && c.kind) || "기타"; }
  function ghCategory(c) { return (c && c.category) || "기타"; }

  function githubRowHTML(c) {
    const full = String(c.repo || c.title || "");
    const slash = full.lastIndexOf("/");
    const owner = slash > 0 ? full.slice(0, slash) : "";
    const name = slash > 0 ? full.slice(slash + 1) : full;
    const href = c.url ? esc(c.url) : "#";
    const num = typeof c.stars_delta === "number"
      ? `<b class="g-up">+${N(c.stars_delta)}</b>`
      : `<b>${N(c.stars || 0)}</b>`;
    const sub = typeof c.stars_delta === "number" && typeof c.stars === "number"
      ? `<i>${N(c.stars)}</i>` : `<i>누적</i>`;
    // 한국어 분석(note_ko)이 최우선, 없으면 요약(summary_ko), 그것도 없으면
    // GitHub 이 준 영어 설명(desc)을 그대로 쓴다. 셋 다 없을 때만 줄을 지운다 —
    // 빈 줄을 남기면 표가 들쭉날쭉해진다.
    const line = c.note_ko || c.summary_ko || c.desc || "";
    const when = c.updated_at ? `<span class="g-when">${esc(c.updated_at.slice(5).replace("-", "/"))}</span>` : "";
    const detail = line || when
      ? `<div class="g-desc">${when}${line ? `<span>${esc(line)}</span>` : ""}</div>`
      : "";
    return `<div class="g-item">
      <div class="v-row g-row">
        <span class="g-repo">
          <a href="${href}" target="_blank" rel="noopener noreferrer">${esc(name)}</a>
          ${owner ? `<i>${esc(owner)}</i>` : ""}
        </span>
        <span class="g-cat">${esc(ghCategory(c))}</span>
        <span class="v-when">${num}${sub}</span>
      </div>
      ${detail}
    </div>`;
  }

  function githubTableHTML(visibleCards, headerBasisCards) {
    const basis = headerBasisCards || visibleCards;
    const rising = basis.some(c => typeof c.stars_delta === "number");
    return `<div class="v-table">
      <div class="v-row g-row v-head">
        <span>레포</span><span>부문</span><span>${rising ? "주간 ★" : "누적 ★"}</span>
      </div>
      ${visibleCards.map(githubRowHTML).join("")}
    </div>`;
  }

  // ── GitHub 스킬: 종류 축 + 부문 칩 + Top 20 + 더보기 ──────────────────────
  // 종류(스킬/MCP 서버/에이전트 프레임워크/CLI·개발도구)가 부문 위의 상위 축이다.
  // 종류를 고르면 부문 칩은 "그 종류에 속한 카드"만으로 다시 세어 그린다 —
  // 부문이 상위 필터를 무시하고 항상 전체에서 세면 숫자가 선택과 안 맞아 보인다.
  // 20장을 한 번에 쏟아내면 스크롤이 끝없어진다. 5개만 먼저 보여주다 더보기로
  // 나머지(현재 종류+부문 선택 안에서 최대 20개)를 편다. 상태는 이 섹션 전용으로
  // 모듈 스코프에 두고, 축/더보기를 누르면 #ghWrap 안쪽만 다시 그린다.
  const ghState = { cards: [], kind: "all", category: "all", expanded: false };

  function ghCountsBy(cards, keyFn) {
    const counts = new Map();
    cards.forEach(c => {
      const key = keyFn(c);
      counts.set(key, (counts.get(key) || 0) + 1);
    });
    return Array.from(counts.entries());
  }

  function ghKindCounts(cards) { return ghCountsBy(cards, ghKind); }
  function ghCategoryCounts(cards) { return ghCountsBy(cards, ghCategory); }

  function ghKindFilteredCards() {
    if (ghState.kind === "all") return ghState.cards;
    return ghState.cards.filter(c => ghKind(c) === ghState.kind);
  }

  function ghFilteredCards() {
    const byKind = ghKindFilteredCards();
    if (ghState.category === "all") return byKind;
    return byKind.filter(c => ghCategory(c) === ghState.category);
  }

  function ghKindChipsHTML() {
    const kinds = ghKindCounts(ghState.cards);
    const allBtn = `<button type="button" class="gh-chip" data-kind="all" aria-pressed="${ghState.kind === "all"}">전체<span class="gh-chip-n">${ghState.cards.length}</span></button>`;
    const kindBtns = kinds.map(([kind, n]) => `<button type="button" class="gh-chip" data-kind="${esc(kind)}" aria-pressed="${ghState.kind === kind}">${esc(kind)}<span class="gh-chip-n">${n}</span></button>`).join("");
    return `<div class="gh-axis"><p class="gh-axis-label">종류</p><div class="gh-chips" role="group" aria-label="종류 선택">${allBtn}${kindBtns}</div></div>`;
  }

  function ghChipsHTML() {
    // 부문은 종류로 거른 카드 기준으로 다시 세어, 선택된 종류 안에서만 부문이 보이게 한다.
    const basis = ghKindFilteredCards();
    const cats = ghCategoryCounts(basis);
    const allBtn = `<button type="button" class="gh-chip" data-cat="all" aria-pressed="${ghState.category === "all"}">전체<span class="gh-chip-n">${basis.length}</span></button>`;
    const catBtns = cats.map(([cat, n]) => `<button type="button" class="gh-chip" data-cat="${esc(cat)}" aria-pressed="${ghState.category === cat}">${esc(cat)}<span class="gh-chip-n">${n}</span></button>`).join("");
    return `<div class="gh-axis"><p class="gh-axis-label">부문</p><div class="gh-chips" role="group" aria-label="부문 선택">${allBtn}${catBtns}</div></div>`;
  }

  function ghBodyHTML() {
    const filtered = ghFilteredCards();
    const cap = Math.min(filtered.length, 20);
    const visible = filtered.slice(0, ghState.expanded ? cap : Math.min(5, cap));
    const table = filtered.length
      ? githubTableHTML(visible, filtered)
      : `<div class="empty">이 선택에는 항목이 없습니다.</div>`;
    const canExpand = cap > 5;
    const moreBtn = canExpand
      ? `<button type="button" class="gh-more" id="ghMoreBtn" aria-expanded="${ghState.expanded}">${ghState.expanded ? "접기" : `더보기 (${cap - 5}개 더)`}</button>`
      : "";
    return `${table}${moreBtn}`;
  }

  function ghWrapInnerHTML() {
    return `${ghKindChipsHTML()}${ghChipsHTML()}<div id="ghBody">${ghBodyHTML()}</div>`;
  }

  function renderGithubSection(cards) {
    ghState.cards = cards;
    ghState.expanded = false;
    const kinds = new Set(ghKindCounts(cards).map(([k]) => k));
    if (ghState.kind !== "all" && !kinds.has(ghState.kind)) ghState.kind = "all";
    const basis = ghState.kind === "all" ? cards : cards.filter(c => ghKind(c) === ghState.kind);
    const cats = new Set(ghCategoryCounts(basis).map(([c]) => c));
    if (ghState.category !== "all" && !cats.has(ghState.category)) ghState.category = "all";
    return `<div id="ghWrap">${ghWrapInnerHTML()}</div>`;
  }

  function updateGithubDOM() {
    const wrap = document.getElementById("ghWrap");
    if (wrap) wrap.innerHTML = ghWrapInnerHTML();
  }

  // ── 원문 토글: 해외 뉴스에서 title_ko가 헤드라인일 때 "원문" 버튼으로 원제를 펼친다 ──
  function toggleNewsOriginal(btn) {
    const targetId = btn.dataset.origToggle;
    const target = targetId && document.getElementById(targetId);
    if (!target) return;
    const willShow = target.hasAttribute("hidden");
    if (willShow) target.removeAttribute("hidden");
    else target.setAttribute("hidden", "");
    btn.setAttribute("aria-expanded", String(willShow));
  }

  // 이벤트 위임: el.board 자체는 교체되지 않으므로(innerHTML만 바뀐다) 한 번만 건다.
  // GitHub 종류/부문 칩·더보기와 뉴스 "원문" 토글을 여기 한곳에서 함께 처리한다.
  function bindBoardEvents() {
    el.board.addEventListener("click", e => {
      const kindChip = e.target.closest("[data-kind]");
      if (kindChip) {
        ghState.kind = kindChip.dataset.kind;
        ghState.category = "all";
        ghState.expanded = false;
        updateGithubDOM();
        return;
      }
      const catChip = e.target.closest("[data-cat]");
      if (catChip) {
        ghState.category = catChip.dataset.cat;
        ghState.expanded = false;
        updateGithubDOM();
        return;
      }
      const more = e.target.closest("#ghMoreBtn");
      if (more) {
        ghState.expanded = !ghState.expanded;
        updateGithubDOM();
        return;
      }
      const msMore = e.target.closest("#msMoreBtn");
      if (msMore) {
        const box = document.getElementById("msMonths");
        if (box) {
          const open = box.classList.toggle("open");
          msMore.setAttribute("aria-expanded", String(open));
          msMore.textContent = open ? "접기" : msMore.dataset.label;
        }
        return;
      }
      const origBtn = e.target.closest(".n-orig-btn");
      if (origBtn) {
        toggleNewsOriginal(origBtn);
      }
    });
  }

  // ── 커뮤니티: 커뮤니티 | 전체 순위 | 유입 ──────────────────────────────────
  function communityTableHTML(cards) {
    // 전체 트래픽 순위를 버리고 각 커뮤니티가 실제로 공개하는 숫자를 쓴다.
    // 단위가 제각각(회원수·구독자·점수)이라 숫자만 적으면 비교가 되는 것처럼 보인다.
    // 그래서 **단위를 항상 함께** 적고, 못 재는 곳은 못 잰다고 적는다.
    const rows = cards.map(c => {
      const has = typeof c.signal_value === "number";
      const val = has
        ? `<b>${N(c.signal_value)}</b><i>${esc(c.signal_kind || "")}</i>`
        : `<b class="v-none">—</b><i class="v-none">${esc(c.signal_kind || "측정 불가")}</i>`;
      const grav = c.mentions ? `<i class="v-fresh">유입 ${N(c.mentions)}</i>` : "";
      const href = c.url ? esc(c.url) : "#";
      return `<div class="v-row c-row">
        <span class="v-co"><a href="${href}" target="_blank" rel="noopener noreferrer">${esc(c.title || "")}</a></span>
        <span class="c-dom">${esc(c.note || "")}</span>
        <span class="v-when">${val}${grav}</span>
      </div>`;
    }).join("");
    return `<div class="v-table">
      <div class="v-row c-row v-head"><span>커뮤니티</span><span></span><span>활동 신호</span></div>
      ${rows}
    </div>`;
  }

  // ── 오늘의 키워드 ────────────────────────────────────────────────────────
  // 필을 탭하면 그 키워드가 실제로 어느 기사에서 나왔는지 아래에 펼친다.
  // "8회 언급"만 있으면 그 8개가 무엇인지 확인할 방법이 없었다.
  function keywordCardHTML(c) {
    const items = Array.isArray(c.items) ? c.items : [];
    const n = typeof c.mentions === "number" ? c.mentions : items.length;
    const ko = c.keyword_ko && c.keyword_ko !== c.keyword
      ? ` <span class="kw-ko">${esc(c.keyword_ko)}</span>` : "";
    const src = typeof c.source_count === "number" && c.source_count > 1
      ? ` · 출처 ${c.source_count}곳` : "";
    const head = `<p class="kwd-head"><b>${esc(c.keyword || "")}</b>${ko} — 오늘 ${n}개 항목${src}</p>`;
    const list = items.length
      ? `<div class="kwd-list">${items.map(it => `<div class="kwd-item">
          <span class="kwd-src">${esc((it && it.source) || "")}</span>
          <a href="${it && it.url ? esc(it.url) : "#"}" target="_blank" rel="noopener noreferrer">${esc((it && it.title) || "")}</a>
        </div>`).join("")}</div>`
      : `<p class="kw-empty">이 키워드가 걸린 항목을 실어 보내지 못했습니다.</p>`;
    return `${head}${list}`;
  }

  function keywordPillHTML(c, i) {
    const term = esc(c.keyword || c.keyword_ko || "");
    const isNew = c.change === "new";
    const mentions = typeof c.mentions === "number"
      ? `<span class="kw-n">${N(c.mentions)}회</span>` : "";
    return `<button type="button" class="kw-pill" id="kwPill-${i}" aria-expanded="false" aria-controls="kwDetail" data-idx="${i}">
      <span class="kw-word${isNew ? " new" : ""}">${term}</span>${mentions}
    </button>`;
  }

  function toggleKwDetail(idx) {
    const detail = document.getElementById("kwDetail");
    if (!detail) return;
    const opening = kwState.openIndex !== idx;
    el.kwStrip.querySelectorAll(".kw-pill").forEach(b => b.setAttribute("aria-expanded", "false"));
    if (!opening) {
      kwState.openIndex = -1;
      detail.innerHTML = "";
      return;
    }
    kwState.openIndex = idx;
    const btn = document.getElementById("kwPill-" + idx);
    if (btn) btn.setAttribute("aria-expanded", "true");
    const card = kwState.cards[idx];
    detail.innerHTML = card ? keywordCardHTML(card) : "";
  }

  function renderKeywordStrip(section) {
    kwState.cards = [];
    kwState.openIndex = -1;
    if (!section) { el.kwStrip.innerHTML = ""; return; }
    const cards = Array.isArray(section.cards) ? section.cards : [];
    const label = esc(section.title || "오늘의 키워드");
    if (!cards.length) {
      const msg = esc(section.empty_reason || "오늘은 키워드가 없습니다.");
      el.kwStrip.innerHTML = `<p class="kw-strip-label">${label}</p><p class="kw-empty">${msg}</p>`;
      return;
    }
    kwState.cards = cards;
    el.kwStrip.innerHTML = `
      <p class="kw-strip-label">${label}</p>
      <div class="kw-row" id="kwRow">${cards.map(keywordPillHTML).join("")}</div>
      <div id="kwDetail"></div>`;
    const row = document.getElementById("kwRow");
    if (row) {
      row.addEventListener("click", e => {
        const btn = e.target.closest(".kw-pill");
        if (btn) toggleKwDetail(Number(btn.dataset.idx));
      });
    }
  }

  // ── 모델 업데이트 표 ─────────────────────────────────────────────────────
  function isVendorCard(c) {
    return c && (Object.prototype.hasOwnProperty.call(c, "days_since")
                 || Object.prototype.hasOwnProperty.call(c, "open_weights"));
  }

  function fmtWhen(c) {
    const d = c.updated_at;
    if (!d) return { date: "—", rel: "소식 없음", quiet: true };
    const [y, m, day] = d.split("-");
    const thisYear = String(new Date().getFullYear());
    const n = c.days_since;
    let rel;
    if (n === 0) rel = "오늘";
    else if (n === 1) rel = "어제";
    else if (n < 30) rel = n + "일";
    else if (n < 365) rel = Math.floor(n / 30) + "개월";
    else rel = (n / 365).toFixed(1) + "년";
    // 올해가 아니면 년도까지 적는다. 같은 해면 월일만 — 자릿수가 짧을수록 읽기 쉽다.
    const date = y === thisYear ? `${m}/${day}` : `${y.slice(2)}.${m}/${day}`;
    return { date, rel, quiet: false, stale: n >= 90 };
  }

  // 다음 예정: 회사가 날짜를 말한 것(확정)과 관측·소문(예정)을 색으로 가른다.
  // 아무것도 못 찾았으면 빈칸이 아니라 "—" 를 둔다 — 빈칸은 버그처럼 보인다.
  function nextLineHTML(c) {
    const label = c.next_label || c.next_date;
    if (!label) return "";
    const fixed = c.next_confidence === "확정";
    // 라벨이 날짜가 아니라 단계("준비 중")면 (예정) 꼬리표는 같은 말을 두 번
    // 하는 것이다 — "다음 예정 준비 중 예정" 으로 읽힌다. 날짜일 때만 붙인다.
    const dated = /\d/.test(label);
    const tag = dated
      ? `<i class="${fixed ? "fix" : "exp"}">${fixed ? "확정" : "예정"}</i>`
      : "";
    const link = c.next_url
      ? ` <a class="v-src" href="${esc(c.next_url)}" target="_blank" rel="noopener" aria-label="근거 열기">↗</a>`
      : "";
    return `<div class="v-next"><span class="v-next-lab">다음 예정</span>`
         + `<b>${esc(label)}</b>${tag}${link}</div>`;
  }

  function vendorTableHTML(cards) {
    const rows = cards.map(c => {
      const w = fmtWhen(c);
      // 모델은 이름만 두고 근거 페이지는 아이콘 하나로 접는다.
      // 제목 전체를 링크로 깔면 줄이 길어져 표가 읽히지 않는다.
      const link = c.url
        ? ` <a class="v-src" href="${esc(c.url)}" target="_blank" rel="noopener" title="${esc(c.headline || c.model || "")} — ${esc(c.via || "출처")}" aria-label="근거 페이지 열기">↗</a>`
        : "";
      const model = c.model
        ? `<span class="v-name">${esc(c.model)}</span>${link}`
        : `<span class="v-none">—</span>`;
      const relCls = w.quiet ? "v-none" : (w.stale ? "v-stale" : (c.days_since <= 1 ? "v-fresh" : ""));
      // '다음 예정'은 **값이 있을 때만 아랫줄**로 붙인다. 열로 두었더니 폰 폭에서
      // 회사와 모델이 "Alibaba Q…" "Q…" 까지 잘렸는데, 정작 그 열은 대부분 "—" 였다.
      // 거의 비어 있는 열에 폭을 내주고 늘 있는 정보를 잘라내는 건 거꾸로다.
      const next = nextLineHTML(c);
      return `<div class="v-item${next ? " has-next" : ""}">
        <div class="v-row m-row">
          <span class="v-co">${esc(c.title || "")}</span>
          <span class="v-model">${model}</span>
          <span class="v-when"><b>${esc(w.date)}</b><i class="${relCls}">${esc(w.rel)}</i></span>
        </div>${next}
      </div>`;
    }).join("");
    return `<div class="v-table">
      <div class="v-row m-row v-head"><span>회사</span><span>최신 모델</span><span>갱신</span></div>
      ${rows}
    </div>`;
  }

  // ── 1년 마일스톤 ─────────────────────────────────────────────────────────
  // 띠 하나 + 달별 목록. 가로 스크롤은 쓰지 않는다 — 1년을 보여주겠다면서
  // 한 번에 7%만 보이던 게 이전 설계였다.
  const MS_MONTH_LENGTHS = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  const MS_RECENT_ITEMS = 8;   // 접힌 상태에서 보여줄 최근 출시 건수

  function milestoneHTML(ms) {
    if (!ms) return "";
    const points = Array.isArray(ms.points) ? ms.points : [];
    const total = ms.total_days || 365;
    const year = ms.year || new Date().getFullYear();
    const today = typeof ms.today_day_of_year === "number" ? ms.today_day_of_year : null;
    // 40건만 실은 날에는 그렇게 적는다. "1년"이라 써 놓고 최근 몇 달만
    // 보여주면서 아무 말도 안 하면, 앞쪽이 비어 있는 게 사실인지 버그인지 알 수 없다.
    const note = ms.note ? `<span class="ms-note">${esc(ms.note)}</span>` : "";
    const head = `<p class="ms-label">${year}년 모델 출시 · ${points.length}건${note}</p>`;
    if (!points.length) {
      return `<div class="ms-wrap">${head}`
           + `<p class="ms-empty">올해 축에 올릴 모델 출시를 찾지 못했습니다.</p></div>`;
    }

    const pct = d => (Math.max(1, Math.min(total, d)) / total) * 100;
    const leap = total === 366;

    // 달 눈금. 폰 폭에서는 12개 이름이 다 안 들어가므로 숫자만 쓰고,
    // 좁으면 홀수 달만 적는다 — 눈금선은 12개 그대로 둔다.
    const narrow = typeof window !== "undefined" && window.innerWidth < 420;
    const ticks = [];
    let acc = 1;
    for (let i = 0; i < 12; i++) {
      const left = pct(acc);
      ticks.push(`<span class="ms-tick" style="left:${left}%"></span>`);
      if (!narrow || i % 2 === 0) {
        ticks.push(`<span class="ms-mon" style="left:${left}%">${i + 1}</span>`);
      }
      acc += MS_MONTH_LENGTHS[i] + (i === 1 && leap ? 1 : 0);
    }

    const dots = points
      .map(p => `<span class="ms-dot${p.future ? " soon" : ""}" style="left:${pct(p.day_of_year)}%"></span>`)
      .join("");
    const todayMark = today !== null
      ? `<span class="ms-today" style="left:${pct(today)}%"><span>오늘</span></span>` : "";

    const bar = `<div class="ms-bar"><span class="ms-axis"></span>`
              + `${ticks.join("")}${dots}${todayMark}</div>`;

    // 달별 목록. 출시가 없는 달은 줄 자체를 만들지 않는다 —
    // 빈 줄 열두 개는 1년이 아니라 여백만 보여준다.
    const byMonth = new Map();
    points.forEach(p => {
      const mth = Number(String(p.date || "").split("-")[1] || 0);
      if (!mth) return;
      if (!byMonth.has(mth)) byMonth.set(mth, []);
      byMonth.get(mth).push(p);
    });

    // 접힌 상태에서는 **가장 최근 8건**만 남긴다. 달 단위로 잘라 봤더니
    // 출시가 최근 두 달에 몰려 있어 전혀 줄지 않았다(698px). 세는 단위를
    // 달에서 건으로 바꿔야 실제로 짧아진다.
    // 예정은 접지 않는다 — 축에서 가장 궁금한 쪽이 오른쪽이고, 몇 건 되지도 않는다.
    const recent = new Set([
      ...points.filter(p => p.future),
      ...[...points].filter(p => !p.future)
                    .sort((a, b) => (a.date < b.date ? 1 : -1))
                    .slice(0, MS_RECENT_ITEMS),
    ]);
    const hiddenCount = points.length - recent.size;

    const months = [...byMonth.keys()].sort((a, b) => a - b);
    const rows = months.map(mth => {
      const group = byMonth.get(mth);
      const items = group.map(p => {
        // 앞날은 색으로도 글자로도 구분한다. 색만으로는 '확정'과 '예정'이
        // 갈리지 않는데, 소문을 일어난 일처럼 읽으면 그건 오보다.
        const soon = p.future ? " soon" : "";
        const hid = recent.has(p) ? "" : " ms-hid";
        const tag = p.future
          ? `<i class="ms-tag${p.confidence === "확정" ? " fix" : ""}">${esc(p.confidence || "예정")}</i>`
          : "";
        const inner = `<b>${esc(p.label || "")}</b>${esc(p.model || "")}${tag}`;
        return p.url
          ? `<a class="ms-i${soon}${hid}" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${inner}</a>`
          : `<span class="ms-i${soon}${hid}">${inner}</span>`;
      }).join("");
      // 이 달에 보일 것이 하나도 없으면 달 줄 자체를 숨긴다.
      const rowHid = group.some(p => recent.has(p)) ? "" : " ms-hid";
      return `<div class="ms-mrow${rowHid}"><span class="ms-mname">${mth}월</span>`
           + `<span class="ms-items">${items}</span></div>`;
    }).join("");

    const more = hiddenCount
      ? `<button type="button" class="gh-more" id="msMoreBtn" aria-expanded="false"
          data-label="더보기 (${hiddenCount}건 더)">더보기 (${hiddenCount}건 더)</button>`
      : "";

    return `<div class="ms-wrap">${head}${bar}`
         + `<div class="ms-months" id="msMonths">${rows}</div>${more}</div>`;
  }

  // ── 일반 카드: 위 어느 표에도 해당하지 않는 섹션이 새로 생겼을 때의 안전망.
  // 없으면 낯선 섹션 하나가 페이지 전체를 죽인다 (실제로 그렇게 죽었다).
  function plainCardHTML(c) {
    const title = esc(c.title || c.keyword || "");
    const head = c.url
      ? `<a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">${title}</a>`
      : title;
    const note = c.summary_ko || c.note_ko || c.note || "";
    return `<article class="card"><p class="c-title">${head}</p>${note ? `<p class="c-note">${esc(note)}</p>` : ""}<p class="c-meta">${plainMeta(c)}</p></article>`;
  }

  function cardHTML(c) {
    if (isKeywordCard(c)) return keywordCardHTML(c);
    if (isGithubCard(c)) return newsRowHTML(c);
    return plainCardHTML(c);
  }

  function sectionHTML(s) {
    const anchor = "s-" + esc(s.id || "");
    const briefing = Array.isArray(s.briefing_ko) && s.briefing_ko.length
      ? `<div class="briefing"><ul>${s.briefing_ko.map(b => `<li>${esc(b)}</li>`).join("")}</ul></div>`
      : "";
    const cards = Array.isArray(s.cards) ? s.cards : [];
    let body;
    if (!cards.length) {
      body = `<div class="empty">${esc(s.empty_reason || "오늘은 비어 있습니다.")}</div>`;
    } else if (cards.every(isVendorCard)) {
      body = vendorTableHTML(cards);
    } else if (s.id === "github_skills") {
      body = renderGithubSection(cards);
    } else if (s.id === "communities") {
      body = regionSplitHTML(cards, group => communityTableHTML(group));
    } else if (s.id === "top_headlines") {
      body = regionSplitHTML(cards, group => `<div class="n-list">${group.map(newsRowHTML).join("")}</div>`);
    } else {
      body = `<div class="cards">${cards.map(cardHTML).join("")}</div>`;
    }
    const ms = milestoneHTML(s.milestone);
    // 섹션 주석: "왜 이만큼뿐인가"를 적는 자리다. 목록이 짧은 이유를 말하지 않으면
    // 사용자는 짧은 것과 고장난 것을 구별할 수 없다 — 실제로 구별하지 못했다.
    // 본문 **아래**에 둔다. 읽기 전에 변명부터 읽힐 이유는 없다.
    const notes = Array.isArray(s.notes) && s.notes.length
      ? `<ul class="s-notes">${s.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>`
      : "";
    return `<section id="${anchor}"><h2>${esc(s.title || "")}</h2>${briefing}${ms}${body}${notes}</section>`;
  }

  // ── 상태/헤더 렌더링 ──────────────────────────────────────────────────────
  function renderStatus(board, stale) {
    const chips = [];
    if (stale) {
      chips.push(`<span class="chip stale">${esc(formatBoardDateShort(board.board_date))} 기준 · 오늘 보드가 아직 없습니다</span>`);
    }
    if (board.status && board.status !== "ok") {
      const label = board.status === "degraded" ? "수집량이 평소보다 적음" : "일부 소스 실패";
      chips.push(`<span class="chip warn">${esc(label)}</span>`);
    }
    const sections = Array.isArray(board.sections) ? board.sections : [];
    const cardCount = sections.reduce((n, s) => n + (Array.isArray(s.cards) ? s.cards.length : 0), 0);
    const countBits = [`항목 ${cardCount}개`];
    if (Array.isArray(board.sources_status)) {
      const okCount = board.sources_status.filter(s => s && s.ok).length;
      countBits.push(`출처 ${okCount}곳`);
    }
    chips.push(`<span class="chip">${esc(countBits.join(" · "))}</span>`);
    el.statusRow.innerHTML = chips.join("");
  }

  function renderNav(sections) {
    el.jumpNav.innerHTML = sections
      .map(s => `<a href="#s-${esc(s.id || "")}">${esc(s.title || "")}</a>`)
      .join("");
  }

  function renderBoard(board, stale) {
    el.dateLine.textContent = formatGeneratedAt(board.generated_at);
    renderStatus(board, stale);
    const allSections = Array.isArray(board.sections) ? board.sections : [];
    // "keywords" 섹션은 일반 흐름에서 빼내 헤더 바로 아래 전용 스트립으로 그린다.
    // 나머지 섹션은 여전히 JSON 순서 그대로, 하드코딩 없이 일반 규칙으로 그린다.
    const keywordSection = allSections.find(s => s && s.id === "keywords");
    const otherSections = allSections.filter(s => !(s && s.id === "keywords"));
    renderKeywordStrip(keywordSection);
    renderNav(otherSections);
    el.board.innerHTML = otherSections.map(sectionHTML).join("");
  }

  function renderFatalError() {
    el.dateLine.textContent = "";
    el.statusRow.innerHTML = `<span class="chip stale">불러오기 실패</span>`;
    el.kwStrip.innerHTML = "";
    el.jumpNav.innerHTML = "";
    el.board.innerHTML = `<div class="empty">오늘 보드를 불러오지 못했습니다. 네트워크를 확인한 뒤 새로고침해 주세요.</div>`;
  }

  (async function init() {
    bindBoardEvents();
    const { board, fetchFailed } = await loadBoard();
    if (!board) {
      renderFatalError();
      return;
    }
    const stale = fetchFailed || (typeof board.board_date === "string" && board.board_date !== todayKST());
    renderBoard(board, stale);
  })();

  // ── 서비스 워커: 셸은 캐시 우선, latest.json은 네트워크 우선 + 캐시 대체.
  // localStorage 캐시(위의 CACHE_KEY)를 대체하는 게 아니라 그 위에 얹는 2번째 층이다.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js").catch(() => { /* 등록 실패해도 페이지는 그대로 동작한다 */ });
    });
    // 워커가 "셸이 바뀌었다"고 알리면 한 번만 새로고침한다. 한 세션에 한 번으로
    // 잠그지 않으면, 갱신이 실패하는 상황에서 새로고침이 무한히 돈다.
    navigator.serviceWorker.addEventListener("message", (e) => {
      if (!e.data || e.data.type !== "shell-updated") return;
      try {
        if (sessionStorage.getItem("shellReloaded")) return;
        sessionStorage.setItem("shellReloaded", "1");
      } catch (_) { return; }   // 저장할 수 없으면 새로고침도 하지 않는다
      location.reload();
    });
  }
</script>
</body>
</html>
