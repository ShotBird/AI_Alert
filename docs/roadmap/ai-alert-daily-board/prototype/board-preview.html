      <div class="meta">
        <span class="strong">출처 ${c.count}곳</span>
        <span>${esc(c.sources)}</span>
        <span>화제도 ${c.heat}</span>
      </div>
    </article>`;
  }

  function kwHTML(k) {
    const peak = Math.max(k.naver.cafe, k.naver.blog, k.kakao.web);
    const bar = (lab, v) => `<div class="rbar">
        <span class="lab">${lab}</span>
        <span class="track"><span class="fill" style="width:${Math.round(v / peak * 100)}%"></span></span>
        <span class="num">${N(v)}</span>
      </div>`;
    return `<article class="card">
      <div class="card-top">${badge(k.change)}</div>
      <div class="kw-head">
        <h3 class="kw-term">${esc(k.term)}</h3>
        <span class="kw-ko">${esc(k.ko)}</span>
      </div>
      <p class="summary">오늘 ${k.mentions}개 항목에서 언급됐습니다.</p>
      <div class="reaction">
        ${bar("네이버 카페", k.naver.cafe)}
        ${bar("네이버 블로그", k.naver.blog)}
        ${bar("다음 웹", k.kakao.web)}
      </div>
      <div class="picks">
        ${k.picks.map(p => `<div><a href="#">${esc(p.t)}</a> <span class="src">${esc(p.s)}</span></div>`).join("")}
      </div>
    </article>`;
  }

  function sectionHTML(s, opts) {
    const empty = opts.partial && s.id === "github_skills";
    const body = empty
      ? `<div class="empty">GitHub 응답이 없어 오늘은 비어 있습니다. 내일 다시 채워집니다.</div>`
      : `<div class="cards">${s.cards.map(cardHTML).join("")}</div>`;
    return `<section id="${s.anchor}">
      <h2>${esc(s.title)}</h2>
      <div class="briefing"><ul>${s.briefing_ko.map(b => `<li>${esc(b)}</li>`).join("")}</ul></div>
      ${body}
    </section>`;
  }

  function render(state) {
    const partial = state === "partial";
    const stale = state === "stale";

    const chips = [];
    if (stale) {
      chips.push('<span class="chip stale">9월 20일 기준 · 오늘 보드가 아직 없습니다</span>');
    } else if (partial) {
      chips.push('<span class="chip warn">일부만 채워짐 · 소스 2곳 실패</span>');
      chips.push('<span class="chip">항목 14개</span>');
    } else {
      chips.push('<span class="chip">항목 20개 · 출처 23곳</span>');
    }
    document.getElementById("statusRow").innerHTML = chips.join("");

    document.getElementById("dateLine").textContent = stale
      ? "2026년 9월 20일 일요일 · 어제 오전 4시 05분 생성"
      : "2026년 9월 21일 월요일 · 오전 4시 02분 생성";

    const kwSection = {
      id: "keywords", title: "오늘의 키워드", anchor: "s-kw",
      briefing_ko: [
        "EU AI법이 오늘 가장 많이 언급된 주제입니다. 어제는 없던 키워드입니다.",
        "에이전트형 코딩은 국내 카페 반응이 유독 큽니다.",
        "HBM은 사흘째 이어지고 있어 흐름을 따라갈 만합니다."
      ]
    };

    const sections = BOARD.sections.map(s => sectionHTML(s, { partial })).join("")
      + `<section id="${kwSection.anchor}">
          <h2>${esc(kwSection.title)}</h2>
          <div class="briefing"><ul>${kwSection.briefing_ko.map(b => `<li>${esc(b)}</li>`).join("")}</ul></div>
          <div class="cards">${BOARD.keywords.map(kwHTML).join("")}</div>
        </section>`;

    document.getElementById("board").innerHTML = sections;
  }

  document.querySelectorAll(".panel button[data-state]").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".panel button[data-state]").forEach(b =>
        b.setAttribute("aria-pressed", String(b === btn)));
      render(btn.dataset.state);
      window.scrollTo({ top: 0 });
    });
  });

  const themeBtn = document.querySelector("[data-theme-toggle]");
  themeBtn.addEventListener("click", () => {
    const dark = document.documentElement.getAttribute("data-theme") === "dark";
    document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
    themeBtn.setAttribute("aria-pressed", String(!dark));
    themeBtn.textContent = dark ? "다크" : "라이트";
  });

  render("ok");
</script>
